<script>
  const NS = 'http://www.w3.org/2000/svg'

  // Deterministic PRNG so every export is identical.
  function rng(seed) {
    let s = seed >>> 0
    return () => {
      s = (s + 0x6D2B79F5) >>> 0
      let t = s
      t = Math.imul(t ^ (t >>> 15), t | 1)
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61)
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296
    }
  }

  function el(name, attrs, parent) {
    const node = document.createElementNS(NS, name)
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v)
    if (parent) parent.appendChild(node)
    return node
  }

  function addResistFilter(svg, id, seed, scale) {
    const defs = el('defs', {}, svg)
    const filter = el('filter', { id, x: '-5%', y: '-5%', width: '110%', height: '110%' }, defs)
    el('feTurbulence', { type: 'fractalNoise', baseFrequency: '0.035', numOctaves: '3', seed: String(seed), result: 'noise' }, filter)
    el('feDisplacementMap', { in: 'SourceGraphic', in2: 'noise', scale: String(scale), xChannelSelector: 'R', yChannelSelector: 'G', result: 'wobble' }, filter)
    el('feGaussianBlur', { in: 'wobble', stdDeviation: '0.8' }, filter)
  }

  // Adire eleko: hand-painted starch-resist tiles, pale on indigo.
  function drawAdire(svg) {
    const rand = rng(1960)
    addResistFilter(svg, 'resist', 7, 9)
    const g = el('g', { fill: 'none', stroke: '#d6def4', 'stroke-linecap': 'round', filter: 'url(#resist)', opacity: '0.92' }, svg)
    const size = 200
    for (let row = 0; row < 6; row++) {
      for (let col = 0; col < 6; col++) {
        const x = col * size
        const y = row * size
        const cx = x + size / 2
        const cy = y + size / 2
        el('rect', { x: x + 8, y: y + 8, width: size - 16, height: size - 16, 'stroke-width': 5 }, g)
        el('rect', { x: x + 18, y: y + 18, width: size - 36, height: size - 36, 'stroke-width': 2.5 }, g)
        const motif = (row * 2 + col) % 5
        if (motif === 0) {
          for (let r = 66; r > 8; r -= 16) el('circle', { cx, cy, r, 'stroke-width': 6 }, g)
        } else if (motif === 1) {
          for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) el('circle', { cx: x + 44 + i * 28, cy: y + 44 + j * 28, r: 8 + rand() * 2, fill: '#d6def4', stroke: 'none' }, g)
          }
        } else if (motif === 2) {
          for (let k = 0; k < 5; k++) {
            let d = `M ${x + 34} ${y + 46 + k * 27}`
            for (let s = 0; s < 8; s++) d += ` l 16 ${s % 2 ? 12 : -12}`
            el('path', { d, 'stroke-width': 6 }, g)
          }
        } else if (motif === 3) {
          for (let a = 0; a < 4; a++) {
            el('ellipse', { cx: cx, cy: cy - 38, rx: 18, ry: 38, 'stroke-width': 6, transform: `rotate(${a * 90 + 45} ${cx} ${cy})` }, g)
          }
          el('circle', { cx, cy, r: 9, fill: '#d6def4', stroke: 'none' }, g)
        } else {
          let d = `M ${cx} ${cy}`
          for (let t = 0; t < 22; t += 0.25) {
            const r = 3.2 * t
            d += ` L ${(cx + Math.cos(t) * r).toFixed(1)} ${(cy + Math.sin(t) * r).toFixed(1)}`
          }
          el('path', { d, 'stroke-width': 6 }, g)
        }
      }
    }
    // Crackle veins where the starch broke in the dye bath.
    const veins = el('g', { stroke: '#b8c4e6', 'stroke-width': 1.6, fill: 'none', opacity: '0.55' }, svg)
    for (let i = 0; i < 70; i++) {
      let px = rand() * 1200
      let py = rand() * 1200
      let d = `M ${px.toFixed(1)} ${py.toFixed(1)}`
      for (let s = 0; s < 6; s++) {
        px += (rand() - 0.5) * 70
        py += (rand() - 0.5) * 70
        d += ` L ${px.toFixed(1)} ${py.toFixed(1)}`
      }
      el('path', { d }, veins)
    }
  }

  // Aso-oke: narrow hand-woven strips sewn side by side.
  function drawAsoOke(svg) {
    const rand = rng(66)
    const bands = [
      [64, '#0f6b41'], [10, '#1c1a19'], [30, '#c99a2e'], [18, '#efe6d2'], [84, '#6d1f2b'],
      [8, '#c99a2e'], [42, '#0f6b41'], [6, '#1c1a19'], [58, '#efe6d2'], [12, '#c99a2e'],
      [26, '#6d1f2b'], [12, '#efe6d2']
    ]
    let x = 0
    let i = 0
    while (x < 1200) {
      const [w, color] = bands[i % bands.length]
      el('rect', { x, y: 0, width: w, height: 1200, fill: color }, svg)
      if (color === '#efe6d2' && w > 40) {
        // Openwork holes typical of hand-loomed aso-oke.
        for (let y = 24; y < 1200; y += 36) {
          el('rect', { x: x + w / 2 - 5, y, width: 10, height: 10, fill: '#c99a2e', opacity: 0.75, transform: `rotate(45 ${x + w / 2} ${y + 5})` }, svg)
        }
      }
      if (color === '#6d1f2b' && w > 60) {
        for (let y = 0; y < 1200; y += 22) {
          el('rect', { x: x + 14, y, width: w - 28, height: 3, fill: '#c99a2e', opacity: 0.55 }, svg)
        }
      }
      x += w
      i++
    }
    // Weft texture.
    const weft = el('g', {}, svg)
    for (let y = 0; y < 1200; y += 5) {
      el('rect', { x: 0, y, width: 1200, height: 1.6, fill: '#000', opacity: (0.05 + rand() * 0.05).toFixed(3) }, weft)
    }
    // Seams where strips are joined.
    for (let s = 0; s < 1200; s += 180) {
      el('rect', { x: s, y: 0, width: 2, height: 1200, fill: '#000', opacity: 0.18 }, svg)
    }
  }

  // Oniko: tied-and-bound rings, soft organic edges.
  function drawOniko(svg) {
    addResistFilter(svg, 'dye', 3, 22)
    const defs = svg.querySelector('defs')
    const grad = el('radialGradient', { id: 'bloom' }, defs)
    el('stop', { offset: '0%', 'stop-color': '#dfe6f7', 'stop-opacity': '0.95' }, grad)
    el('stop', { offset: '55%', 'stop-color': '#c7d1ee', 'stop-opacity': '0.45' }, grad)
    el('stop', { offset: '100%', 'stop-color': '#c7d1ee', 'stop-opacity': '0' }, grad)
    const g = el('g', { filter: 'url(#dye)' }, svg)
    const step = 300
    for (let row = -1; row < 6; row++) {
      for (let col = -1; col < 6; col++) {
        const cx = col * step + (row % 2 ? step / 2 : 0)
        const cy = row * step * 0.86
        el('circle', { cx, cy, r: 120, fill: 'url(#bloom)' }, g)
        for (let r = 30; r <= 120; r += 30) {
          el('circle', { cx, cy, r, fill: 'none', stroke: '#e4e9f8', 'stroke-width': r === 120 ? 5 : 9, opacity: r === 120 ? 0.5 : 0.8 }, g)
        }
        el('circle', { cx, cy, r: 10, fill: '#eef2fb' }, g)
      }
    }
  }

  function drawSkyline(group) {
    // Abstracted Lagos Island skyline.
    const towers = [
      [150, 600, 50, 90], [205, 600, 38, 140], [248, 600, 62, 205], [318, 600, 44, 120],
      [368, 600, 70, 250], [445, 600, 40, 160], [490, 600, 58, 290], [555, 600, 46, 185],
      [606, 600, 74, 230], [686, 600, 36, 130], [728, 600, 56, 175], [790, 600, 60, 100]
    ]
    for (const [x, base, w, h] of towers) {
      el('rect', { x, y: base - h, width: w, height: h }, group)
      for (let wy = base - h + 22; wy < base - 16; wy += 26) {
        el('line', { x1: x + 10, y1: wy, x2: x + w - 10, y2: wy, 'stroke-width': 2.5, opacity: 0.6 }, group)
      }
    }
    el('line', { x1: 110, y1: 600, x2: 890, y2: 600 }, group)
    // Spire on the tallest tower.
    el('line', { x1: 519, y1: 310, x2: 519, y2: 262 }, group)
  }

  function drawPillars(group) {
    for (let x = 120; x <= 880; x += 38) {
      const t = (x - 500) / 410
      const top = 712 - 22 * (1 - t * t)
      el('line', { x1: x, y1: top + 1, x2: x, y2: 744 }, group)
    }
  }

  function drawRice(group) {
    const rand = rng(1001)
    for (let i = 0; i < 160; i++) {
      const x = 310 + rand() * 380
      const y = 400 + rand() * 120
      const a = rand() * Math.PI
      el('line', { x1: x, y1: y, x2: x + Math.cos(a) * 12, y2: y + Math.sin(a) * 12 }, group)
    }
  }

  document.querySelectorAll('svg[data-pattern="adire"]').forEach(drawAdire)
  document.querySelectorAll('svg[data-pattern="asooke"]').forEach(drawAsoOke)
  document.querySelectorAll('svg[data-pattern="oniko"]').forEach(drawOniko)
  document.querySelectorAll('[data-skyline]').forEach(drawSkyline)
  document.querySelectorAll('[data-pillars]').forEach(drawPillars)
  document.querySelectorAll('[data-rice]').forEach(drawRice)

  const id = location.hash.slice(1)
  if (id) {
    document.body.classList.add('single')
    document.getElementById(id)?.classList.add('active')
  } else {
    document.body.classList.add('preview')
  }
  document.fonts.ready.then(() => { document.title = 'ready' })
</script>
</body>
</html>
